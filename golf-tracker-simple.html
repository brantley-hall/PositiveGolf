<!DOCTYPE html>
<html>
<head>
    <title>Golf Tracker - Simple Version</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 400px; margin: 0 auto; }
        .header { background: #1a1a1a; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; transition: all 0.3s ease; }
        .header.hidden { display: none; }
        .header.minimized { padding: 10px; margin-bottom: 10px; }
        .hole-section { background: white; padding: 20px; margin: 10px 0; border-radius: 8px; border: 2px solid #ddd; }
        .shot-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 10px 0; }
        .header-row { background: #333; color: white; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; }
        .shot-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 5px 0; }
        .plus-btn { background: white; color: #333; border: 2px solid #ddd; padding: 10px 5px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .plus-btn:hover { background: #f8f9fa; }
        .plus-btn:active { background: #10b981; color: white; border-color: #10b981; transform: scale(0.95); }
        .plus-btn.active { background: #10b981; color: white; border-color: #10b981; }
        .minus-btn { background: white; color: #333; border: 2px solid #ddd; padding: 10px 5px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .minus-btn:hover { background: #f8f9fa; }
        .minus-btn:active { background: #ef4444; color: white; border-color: #ef4444; transform: scale(0.95); }
        .minus-btn.active { background: #ef4444; color: white; border-color: #ef4444; }
        .decrement-btn { background: #fbbf24; color: #333; border: 2px solid #f59e0b; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 6px; font-weight: bold; min-width: 15px; min-height: 15px; }
        .decrement-btn:hover { background: #f59e0b; }
        .decrement-btn:active { background: #d97706; transform: scale(0.95); }
        .controls { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin: 3px; font-size: 12px; }
        .btn:hover { background: #2563eb; }
        .btn:active { background: #1d4ed8; transform: scale(0.95); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-danger:active { background: #b91c1c; transform: scale(0.95); }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-success:active { background: #047857; transform: scale(0.95); }
        .summary { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .current-hole { border: 3px solid #3b82f6 !important; }
        input, select { padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin: 3px; width: 100%; box-sizing: border-box; }
        .nav-buttons { text-align: center; margin: 10px 0; }
        .summary-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛳ Simple Golf Tracker</h1>
            <p>Track + and - for every shot type</p>
        </div>

        <div class="controls">
            <input type="text" id="courseName" placeholder="Course Name">
            <input type="date" id="roundDate">
            <div class="nav-buttons">
                <button class="btn btn-success" onclick="startRound()" id="startBtn">START ROUND</button>
                <button class="btn" onclick="addHole()" id="addHoleBtn" style="display:none;">Add Hole</button>
                <button class="btn" onclick="finishRound()" id="finishBtn" style="display:none;">Finish Round</button>
                <button class="btn" onclick="exportData()" id="exportBtn" style="display:none;">Export CSV</button>
                <button class="btn btn-danger" onclick="clearAllData()">Clear All</button>
                <button class="btn" onclick="toggleHeader()">Toggle Header</button>
            </div>
            <div class="nav-buttons" id="navigation" style="display:none;">
                <strong>Current Hole: <span id="currentHole">0</span></strong> | 
                <strong>Total Holes: <span id="totalHoles">0</span></strong>
                <br><br>
                <button class="btn" onclick="previousHole()">← Previous</button>
                <button class="btn" onclick="nextHole()">Next →</button>
            </div>
        </div>

        <div id="holesContainer"></div>

        <div class="summary">
            <h3>Round Summary</h3>
            <div id="summaryContent">No holes recorded yet</div>
        </div>
    </div>

    <script>
        let holes = [];
        let holeCounter = 0;
        let currentHoleIndex = 0;

        // Initialize
        window.onload = function() {
            document.getElementById('roundDate').valueAsDate = new Date();
            // Don't auto-load saved data - let user explicitly start
            updateUIVisibility();
        };

        function startRound() {
            // Clear any existing data
            holes = [];
            holeCounter = 0;
            currentHoleIndex = 0;
            document.getElementById('holesContainer').innerHTML = '';
            
            // Clear localStorage for fresh start
            localStorage.removeItem('golfTrackerData');
            
            // Add first hole automatically
            addHole();
            
            // Show round controls
            updateUIVisibility();
        }

        function updateUIVisibility() {
            const hasHoles = holes.length > 0;
            const startBtn = document.getElementById('startBtn');
            const addHoleBtn = document.getElementById('addHoleBtn');
            const finishBtn = document.getElementById('finishBtn');
            const exportBtn = document.getElementById('exportBtn');
            const navigation = document.getElementById('navigation');
            
            if (hasHoles) {
                // Program has data - show round controls, hide start
                startBtn.style.display = 'none';
                startBtn.disabled = true;
                addHoleBtn.style.display = 'inline-block';
                finishBtn.style.display = 'inline-block';
                exportBtn.style.display = 'inline-block';
                navigation.style.display = 'block';
            } else {
                // Program is empty - show start, hide round controls
                startBtn.style.display = 'inline-block';
                startBtn.disabled = false;
                addHoleBtn.style.display = 'none';
                finishBtn.style.display = 'none';
                exportBtn.style.display = 'none';
                navigation.style.display = 'none';
            }
        }

        function clearAllData() {
            if (confirm('Clear all data and start fresh?')) {
                holes = [];
                holeCounter = 0;
                currentHoleIndex = 0;
                document.getElementById('holesContainer').innerHTML = '';
                document.getElementById('courseName').value = '';
                document.getElementById('roundDate').valueAsDate = new Date();
                localStorage.removeItem('golfTrackerData');
                updateNavigation();
                updateUIVisibility();
                updateSummary();
            }
        }

        function addHole() {
            holeCounter++;
            const hole = {
                number: holeCounter,
                tee: { plus: 0, minus: 0 },
                approach: { plus: 0, minus: 0 },
                aroundGreen: { plus: 0, minus: 0 },
                putting: { plus: 0, minus: 0 }
            };
            
            holes.push(hole);
            renderHole(hole);
            currentHoleIndex = holes.length - 1;
            updateNavigation();
            updateUIVisibility();
            saveData();
            scrollToCurrentHole();
        }

        function renderHole(hole) {
            const container = document.getElementById('holesContainer');
            
            // Clear all holes and show only the current one
            container.innerHTML = '';
            
            const holeDiv = document.createElement('div');
            holeDiv.className = 'hole-section';
            holeDiv.id = 'hole-' + hole.number;
            
            holeDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                    <h3 style="margin: 0;">Hole ${hole.number}</h3>
                    <button class="btn btn-success" style="font-size: 16px; padding: 12px 20px;" onclick="enterHole(${hole.number})">Enter Hole ${hole.number}</button>
                </div>
                
                <div class="shot-grid">
                    <div class="header-row">Tee</div>
                    <div class="shot-row">
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'tee', 'plus')">-</button>
                        <button class="plus-btn ${hole.tee.plus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'tee', 'plus')">+${hole.tee.plus}</button>
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'tee', 'minus')">-</button>
                        <button class="minus-btn ${hole.tee.minus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'tee', 'minus')">-${hole.tee.minus}</button>
                    </div>
                </div>
                
                <div class="shot-grid">
                    <div class="header-row">Approach</div>
                    <div class="shot-row">
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'approach', 'plus')">-</button>
                        <button class="plus-btn ${hole.approach.plus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'approach', 'plus')">+${hole.approach.plus}</button>
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'approach', 'minus')">-</button>
                        <button class="minus-btn ${hole.approach.minus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'approach', 'minus')">-${hole.approach.minus}</button>
                    </div>
                </div>
                
                <div class="shot-grid">
                    <div class="header-row">Around Green</div>
                    <div class="shot-row">
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'aroundGreen', 'plus')">-</button>
                        <button class="plus-btn ${hole.aroundGreen.plus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'aroundGreen', 'plus')">+${hole.aroundGreen.plus}</button>
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'aroundGreen', 'minus')">-</button>
                        <button class="minus-btn ${hole.aroundGreen.minus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'aroundGreen', 'minus')">-${hole.aroundGreen.minus}</button>
                    </div>
                </div>
                
                <div class="shot-grid">
                    <div class="header-row">Putting</div>
                    <div class="shot-row">
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'putting', 'plus')">-</button>
                        <button class="plus-btn ${hole.putting.plus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'putting', 'plus')">+${hole.putting.plus}</button>
                        <button class="decrement-btn" style="font-size: 8px; padding: 6px 10px; min-width: 20px; min-height: 20px;" onclick="decrementShot(${hole.number}, 'putting', 'minus')">-</button>
                        <button class="minus-btn ${hole.putting.minus > 0 ? 'active' : ''}" onclick="updateShot(${hole.number}, 'putting', 'minus')">-${hole.putting.minus}</button>
                    </div>
                </div>
            `;
            
            container.appendChild(holeDiv);
            updateSummary();
        }

        function updateShot(holeNumber, shotType, direction) {
            const hole = holes.find(h => h.number === holeNumber);
            if (hole) {
                // Check if we're at the maximum (2) before incrementing
                if (direction === 'plus' && hole[shotType].plus >= 2) {
                    return; // Don't increment if already at max
                }
                if (direction === 'minus' && hole[shotType].minus >= 2) {
                    return; // Don't increment if already at max
                }
                
                hole[shotType][direction]++;
                renderHole(hole);
                saveData();
            }
        }

        function enterHole(holeNumber) {
            // Mark hole as entered and move to next hole
            const holeIndex = holes.findIndex(h => h.number === holeNumber);
            if (holeIndex >= 0) {
                // Move to next hole or create new one
                if (holeIndex < holes.length - 1) {
                    currentHoleIndex = holeIndex + 1;
                } else {
                    addHole();
                }
                renderCurrentHole();
                updateNavigation();
                scrollToCurrentHole();
            }
        }

        function decrementShot(holeNumber, shotType, direction) {
            const hole = holes.find(h => h.number === holeNumber);
            if (hole) {
                // Only decrement if above 0
                if (hole[shotType][direction] > 0) {
                    hole[shotType][direction]--;
                    renderHole(hole);
                    saveData();
                }
            }
        }

        function nextHole() {
            if (currentHoleIndex < holes.length - 1) {
                currentHoleIndex++;
                renderCurrentHole();
                updateNavigation();
            } else {
                if (holes.length > 0) {
                    addHole();
                }
            }
        }

        function previousHole() {
            if (currentHoleIndex > 0) {
                currentHoleIndex--;
                renderCurrentHole();
                updateNavigation();
            }
        }

        function toggleHeader() {
            const header = document.querySelector('.header');
            if (header) {
                header.classList.toggle('hidden');
            }
        }

        function renderCurrentHole() {
            if (holes.length > 0 && currentHoleIndex >= 0) {
                // Hide the header when viewing holes
                const header = document.querySelector('.header');
                if (header) {
                    header.classList.add('hidden');
                }
                renderHole(holes[currentHoleIndex]);
            } else {
                // Show header when no holes
                const header = document.querySelector('.header');
                if (header) {
                    header.classList.remove('hidden');
                }
            }
        }

        function scrollToCurrentHole() {
            if (holes.length > 0 && currentHoleIndex >= 0) {
                const currentHoleElement = document.getElementById('hole-' + holes[currentHoleIndex].number);
                if (currentHoleElement) {
                    currentHoleElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    // Highlight current hole
                    document.querySelectorAll('[id^="hole-"]').forEach(el => {
                        el.classList.remove('current-hole');
                    });
                    currentHoleElement.classList.add('current-hole');
                }
            }
        }

        function updateNavigation() {
            document.getElementById('currentHole').textContent = holes.length > 0 ? holes[currentHoleIndex].number : 0;
            document.getElementById('totalHoles').textContent = holes.length;
        }

        function updateSummary() {
            const summaryContent = document.getElementById('summaryContent');
            
            if (holes.length === 0) {
                summaryContent.innerHTML = 'No holes recorded yet';
                return;
            }

            let totals = {
                tee: { plus: 0, minus: 0 },
                approach: { plus: 0, minus: 0 },
                aroundGreen: { plus: 0, minus: 0 },
                putting: { plus: 0, minus: 0 }
            };

            holes.forEach(hole => {
                ['tee', 'approach', 'aroundGreen', 'putting'].forEach(shotType => {
                    totals[shotType].plus += hole[shotType].plus;
                    totals[shotType].minus += hole[shotType].minus;
                });
            });

            const totalPlus = totals.tee.plus + totals.approach.plus + totals.aroundGreen.plus + totals.putting.plus;
            const totalMinus = totals.tee.minus + totals.approach.minus + totals.aroundGreen.minus + totals.putting.minus;

            // Calculate net totals for each shot type
            const teeNet = totals.tee.plus - totals.tee.minus;
            const approachNet = totals.approach.plus - totals.approach.minus;
            const aroundNet = totals.aroundGreen.plus - totals.aroundGreen.minus;
            const puttingNet = totals.putting.plus - totals.putting.minus;
            const overallNet = totalPlus - totalMinus;

            summaryContent.innerHTML = `
                <div class="summary-grid">
                    <div>
                        <div style="background: ${teeNet >= 0 ? '#10b981' : '#ef4444'}; color: white; padding: 15px; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold;">
                            Tee: ${teeNet >= 0 ? '+' : ''}${teeNet}
                        </div>
                    </div>
                    <div>
                        <div style="background: ${approachNet >= 0 ? '#10b981' : '#ef4444'}; color: white; padding: 15px; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold;">
                            Approach: ${approachNet >= 0 ? '+' : ''}${approachNet}
                        </div>
                    </div>
                    <div>
                        <div style="background: ${aroundNet >= 0 ? '#10b981' : '#ef4444'}; color: white; padding: 15px; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold;">
                            Around: ${aroundNet >= 0 ? '+' : ''}${aroundNet}
                        </div>
                    </div>
                    <div>
                        <div style="background: ${puttingNet >= 0 ? '#10b981' : '#ef4444'}; color: white; padding: 15px; border-radius: 4px; text-align: center; font-size: 16px; font-weight: bold;">
                            Putting: ${puttingNet >= 0 ? '+' : ''}${puttingNet}
                        </div>
                    </div>
                </div>
                <div style="text-align: center; font-size: 20px; font-weight: bold; margin-top: 20px;">
                    Overall: <span style="color: ${overallNet >= 0 ? '#10b981' : '#ef4444'};">${overallNet >= 0 ? '+' : ''}${overallNet}</span>
                </div>
            `;
        }

        function finishRound() {
            if (holes.length === 0) {
                alert('No holes recorded yet!');
                return;
            }

            if (confirm('Finish round with ' + holes.length + ' holes? This will export your data and prepare for a new round.')) {
                exportData();
                if (confirm('Round exported! Start a new round?')) {
                    holes = [];
                    holeCounter = 0;
                    currentHoleIndex = 0;
                    document.getElementById('holesContainer').innerHTML = '';
                    document.getElementById('courseName').value = '';
                    document.getElementById('roundDate').valueAsDate = new Date();
                    updateNavigation();
                    updateSummary();
                    localStorage.removeItem('golfTrackerData');
                    alert('New round ready! Good luck!');
                }
            }
        }

        function exportData() {
            if (holes.length === 0) {
                alert('No data to export');
                return;
            }

            let csv = 'Course,Date,Hole,Tee Plus,Tee Minus,Approach Plus,Approach Minus,Around Green Plus,Around Green Minus,Putting Plus,Putting Minus\n';
            
            holes.forEach(hole => {
                csv += '"' + document.getElementById('courseName').value + '","' + document.getElementById('roundDate').value + '",' + hole.number + ',' + hole.tee.plus + ',' + hole.tee.minus + ',' + hole.approach.plus + ',' + hole.approach.minus + ',' + hole.aroundGreen.plus + ',' + hole.aroundGreen.minus + ',' + hole.putting.plus + ',' + hole.putting.minus + '\n';
            });

            // Create download link
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'golf-tracker-' + (document.getElementById('roundDate').value || 'today') + '.csv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function saveData() {
            const data = {
                course: document.getElementById('courseName').value,
                date: document.getElementById('roundDate').value,
                holes: holes
            };
            localStorage.setItem('golfTrackerData', JSON.stringify(data));
        }

        function loadSavedData() {
            try {
                const saved = localStorage.getItem('golfTrackerData');
                if (saved) {
                    const data = JSON.parse(saved);
                    document.getElementById('courseName').value = data.course || '';
                    document.getElementById('roundDate').value = data.date || '';
                    holes = data.holes || [];
                    
                    // Set current hole to the last one or first if none exist
                    currentHoleIndex = holes.length > 0 ? holes.length - 1 : 0;
                    
                    // Show only the current hole
                    if (holes.length > 0) {
                        renderCurrentHole();
                    }
                    
                    // Update hole counter
                    holes.forEach(hole => {
                        holeCounter = Math.max(holeCounter, hole.number);
                    });
                    
                    updateNavigation();
                    updateUIVisibility();
                }
            } catch (error) {
                console.error('Error loading saved data:', error);
                // Clear corrupted data
                localStorage.removeItem('golfTrackerData');
                holes = [];
                holeCounter = 0;
                currentHoleIndex = 0;
                updateNavigation();
                updateUIVisibility();
            }
        }
    </script>
</body>
</html>
